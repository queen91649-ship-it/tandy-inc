name: Weekly Workspace Housekeeping

on:
  schedule:
    # 毎週日曜日 日本時間 PM 23:00 (UTC 14:00) に自動起動
    - cron: '0 14 * * 0'
  workflow_dispatch:
    # 手動起動を許可

jobs:
  housekeeping:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-genai google-auth google-api-python-client

    - name: Run Housekeeping Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
      run: |
        # tandy_watcher がインポート可能なように Python パスを通す
        export PYTHONPATH=$PYTHONPATH:$(pwd):$(pwd)/Outputs/dashboard
        python Outputs/dashboard/tandy_housekeeping.py
