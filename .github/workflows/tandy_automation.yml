name: Tandy.inc Daily Newsletter Automation

on:
  schedule:
    # 毎日日本時間 AM 6:00 (UTC PM 21:00) に自動起動
    - cron: '0 21 * * *'
  workflow_dispatch:
    # 手動実行用トリガー
    inputs:
      reason:
        description: '手動実行の理由'
        required: false
        default: '手動テスト起動'

permissions:
  id-token: write  # GCP OIDC認証に必須
  contents: read   # リポジトリ読み込みに必須

jobs:
  run-tandy-times:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib google-genai

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
        create_credentials_file: true

    - name: Run Tandy.inc Core
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      run: |
        python Outputs/dashboard/tandy_core.py
