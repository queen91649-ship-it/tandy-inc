name: Tandy.inc Daily Newsletter Automation

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '手動実行の理由'
        required: false
        default: '手動テスト起動'

permissions:
  contents: read

jobs:
  run-tandy-times:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib google-genai

    - name: Set up GCP credentials
      run: |
        echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > /tmp/gcp_key.json

    - name: Run Tandy.inc Core
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
        GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_key.json
      run: |
        python Outputs/dashboard/tandy_core.py
