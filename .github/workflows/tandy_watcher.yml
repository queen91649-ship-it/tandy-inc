name: Tandy.inc Inbox Watcher Automation

on:
  schedule:
    # 毎日日本時間 AM 9:00 (UTC AM 0:00)
    - cron: '0 0 * * *'
    # 毎日日本時間 PM 17:00 (UTC AM 8:00)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # GitHubのWebUIから手動実行できるようにする設定
    inputs:
      reason:
        description: '手動起動の理由'
        required: false
        default: '手動テスト起動'

permissions:
  id-token: write  # GCP Workload Identity OIDC トークン生成に必須
  contents: read   # リポジトリ読み取り権限

jobs:
  run-tandy-watcher:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHubリポジトリのチェックアウト
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Pythonのセットアップ
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 依存ライブラリのインストール
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib google-genai python-dateutil

    # 4. GCP Workload Identity 連携認証
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
        create_credentials_file: true

    # 5. Tandy.inc Inbox 監視コアの実行
    - name: Run Tandy.inc Inbox Watcher
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      run: |
        python Outputs/dashboard/tandy_watcher.py
